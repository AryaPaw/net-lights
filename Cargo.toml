[workspace]
resolver = "3"
members = ["native/core", "native/app", "native/update-agent"]
default-members = ["native/app"]

[workspace.package]
version = "1.7.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs", "process"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
gpui-kit = "=0.9.1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Environment", "Win32_Globalization", "Win32_System_IO", "Wdk_System_SystemServices"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
