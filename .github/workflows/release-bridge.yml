name: release-bridge
on:
  push:
    tags: [v1.6.1]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge:
    uses: ./.github/workflows/promote-release.yml
    with:
      channel: bridge
      source_run: ''
      dry_run: false
