name: native-ui-diagnostics
on:
  workflow_dispatch:
    inputs:
      navigation_measurement:
        description: 'Также измерить плавность навигации'
        type: boolean
        required: false
        default: false
      payload_run:
        description: 'Reuse a verified unchanged executable from this full CI run; empty builds this checkout'
        type: string
        required: false
        default: ''
      maximum_history:
        description: 'Use the existing maximum retained-history fixture for diagnostic load'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/1.7.0-ci'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          enable-cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !inputs.payload_run }}
        with:
          key: native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            native-win22-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/tools
            artifacts/rust-target
            artifacts/rust-coverage-target
      - name: Validate reuse of unchanged application inputs
        if: inputs.payload_run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.payload_run }}
        run: |
          if ($env:SOURCE_RUN -cnotmatch '^[1-9][0-9]{0,15}$') { throw 'Invalid source CI identity.' }
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $source.status -cne 'completed' -or $source.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $source.path -cne '.github/workflows/ci.yml' -or $source.event -cnotin @('push','workflow_dispatch') -or $source.head_branch -cnotin @('main','codex/1.7.0-ci')) { throw 'Source must be a completed full CI of this repository.' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $jobs.total_count -gt 100) { throw 'Source job inventory is unavailable.' }
          foreach ($name in @('windows','upgrade (Automatic, v1.6.0)')) {
            $matches = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($matches.Count -ne 1 -or $matches[0].conclusion -cne 'success') { throw 'Source build, coverage and installed automatic upgrade must have passed.' }
          }
          $changed = @(git diff --name-only $source.head_sha $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'Source comparison failed.' }
          $allowed = @('scripts/native-ui-smoke.py','scripts/test-native-ui.ps1','.github/workflows/native-ui-diagnostics.yml','.cursor/skills/net-lights-ship/SKILL.md')
          if (@($changed | Where-Object { $_ -cnotin $allowed -and -not $_.StartsWith('scripts/fixtures/native-frameprobe/',[StringComparison]::Ordinal) }).Count) { throw 'Application, dependency or packaging inputs changed; build this checkout instead.' }
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          @{ sourceRun=$env:SOURCE_RUN;sourceCommit=$source.head_sha;diagnosticCommit=$env:GITHUB_SHA;unchangedApplicationInputs=$true } | ConvertTo-Json | Set-Content TestResults/diagnostic-source.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.payload_run
        with:
          name: native-upgrade-payload
          run-id: ${{ inputs.payload_run }}
          github-token: ${{ github.token }}
          path: artifacts/native-reused
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.payload_run
        with:
          name: upgrade-Automatic-v1.6.0
          run-id: ${{ inputs.payload_run }}
          github-token: ${{ github.token }}
          path: artifacts/native-reused-receipt
      - name: Prepare isolated functional desktop
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed.' }
          scripts/prepare-ci-desktop.ps1 -FunctionalUI -ResultsDirectory TestResults/desktop
      - name: Build this checkout without a stale pinned payload
        if: ${{ !inputs.payload_run }}
        run: scripts/publish.ps1 -OutputDirectory artifacts/native-diagnostic
      - name: Run unchanged functional UI assertions on the current executable
        env:
          NETLIGHTS_NAVIGATION_MEASUREMENT: ${{ inputs.navigation_measurement }}
          SOURCE_RUN: ${{ inputs.payload_run }}
          MAXIMUM_HISTORY: ${{ inputs.maximum_history }}
        run: |
          if ($env:SOURCE_RUN) {
            $exe = (Resolve-Path artifacts/native-reused/publish/NetLights.exe).Path
            $receipt = Get-Content artifacts/native-reused-receipt/ci-upgrade-Automatic-v1-6-0/result.json -Raw | ConvertFrom-Json
            if ($receipt.status -cne 'PASS' -or $receipt.cleanup -cne 'PASS' -or $receipt.scenario -cne 'Automatic' -or $receipt.releaseTag -cne 'v1.6.0' -or (Get-FileHash -LiteralPath $exe).Hash -ine $receipt.native.appSha256) { throw 'Reused executable differs from its installed-tested CI receipt.' }
          } else { $exe = (Resolve-Path artifacts/native-diagnostic/NetLights.exe).Path }
          if ($env:NETLIGHTS_NAVIGATION_MEASUREMENT -cnotin @('true','false')) { throw 'Expected a boolean navigation measurement option.' }
          $extra = @{}
          if ($env:NETLIGHTS_NAVIGATION_MEASUREMENT -ceq 'true') { $extra.NavigationMeasurement = $true }
          if ($env:MAXIMUM_HISTORY -cnotin @('true','false')) { throw 'Expected a boolean maximum-history option.' }
          if ($env:MAXIMUM_HISTORY -ceq 'true') { $extra.MaximumHistory = $true }
          scripts/test-native-ui.ps1 -FunctionalUI @extra -Executable $exe -ExpectedSha256 (Get-FileHash -LiteralPath $exe).Hash -ResultsDirectory TestResults/diagnostic
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ui-diagnostics
          path: |
            TestResults
            !TestResults/**/profile/**
          if-no-files-found: error
