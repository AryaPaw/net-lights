name: release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Release tag has an invalid version: $tag" }
          [xml]$props = Get-Content Directory.Build.props
          if ($version -cne $props.Project.PropertyGroup.Version) { throw "Tag $tag differs from Directory.Build.props version $($props.Project.PropertyGroup.Version)" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore NetLights.slnx --locked-mode
      - name: Build
        run: dotnet build NetLights.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/NetLights.UnitTests/NetLights.UnitTests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings --logger "trx;LogFileName=unit.trx" --results-directory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/unit"
      - name: Integration tests
        run: >
          dotnet test tests/NetLights.IntegrationTests/NetLights.IntegrationTests.csproj -c Release --no-build
          --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          --logger "trx;LogFileName=integration.trx"
          --results-directory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/integration"
      - name: Soak smoke
        run: dotnet test tests/NetLights.SoakTests/NetLights.SoakTests.csproj -c Release --no-build --logger "trx;LogFileName=soak-smoke.trx" --results-directory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/soak"
      - name: Coverage gate
        shell: pwsh
        run: scripts/check-coverage.ps1 -ResultsDirectory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results
          path: TestResults
          if-no-files-found: warn
      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish src/NetLights.App/NetLights.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$v -p:RestoreLockedMode=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "App publish failed: $LASTEXITCODE" }
          dotnet publish src/NetLights.UpdateAgent/NetLights.UpdateAgent.csproj -c Release -r win-x64 --self-contained true -p:Version=$v -p:RestoreLockedMode=false -p:PublishSingleFile=true -p:DebugType=none -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "Update agent publish failed: $LASTEXITCODE" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\InnoSetup6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          & $iscc "/DMyAppVersion=$v" /Oartifacts "/FNetLights-Setup-win-x64-$v" installer/net-lights.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed: $LASTEXITCODE" }
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/NetLights-Setup-win-x64-*.exe
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Если не уверены, скачайте **NetLights-Setup-win-x64-${{ steps.ver.outputs.version }}.exe** и запустите его. Права администратора не нужны.

            | Что нужно | Файл |
            | --- | --- |
            | **Установка** на обычный 64-bit ПК (Intel/AMD) | [NetLights-Setup-win-x64-${{ steps.ver.outputs.version }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NetLights-Setup-win-x64-${{ steps.ver.outputs.version }}.exe) |

            Нужен Windows 11 x64. Сборка self-contained, отдельный .NET Runtime не нужен. Автообновление скачивает Setup и ставит его тихим установщиком.
