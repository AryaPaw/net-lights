name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Successful full CI run for a promotion dry-run'
        type: string
        required: true
      channel:
        type: choice
        options: [native, bridge]
        default: native
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name != 'v1.6.1' && (github.event_name == 'push' || github.ref == 'refs/heads/codex/1.7.0-ci')
    uses: ./.github/workflows/promote-release.yml
    with:
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'native' }}
      source_run: ${{ inputs.source_run || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
