name: ci
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NetLights.slnx --locked-mode
      - name: Build
        run: dotnet build NetLights.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/NetLights.UnitTests/NetLights.UnitTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"
      - name: Integration tests
        run: dotnet test tests/NetLights.IntegrationTests/NetLights.IntegrationTests.csproj -c Release --no-build
      - name: Soak tests
        run: dotnet test tests/NetLights.SoakTests/NetLights.SoakTests.csproj -c Release --no-build
      - name: Publish
        run: dotnet publish src/NetLights.App/NetLights.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
