name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NetLights.slnx --locked-mode
      - name: Build
        run: dotnet build NetLights.slnx -c Release --no-restore
      - name: Unit tests
        run: >
          dotnet test tests/NetLights.UnitTests/NetLights.UnitTests.csproj -c Release --no-build
          --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          --logger "trx;LogFileName=unit.trx"
          --results-directory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/unit"
      - name: Integration tests
        run: >
          dotnet test tests/NetLights.IntegrationTests/NetLights.IntegrationTests.csproj -c Release --no-build
          --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings
          --logger "trx;LogFileName=integration.trx"
          --results-directory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/integration"
      - name: Soak smoke
        run: dotnet test tests/NetLights.SoakTests/NetLights.SoakTests.csproj -c Release --no-build --logger "trx;LogFileName=soak-smoke.trx" --results-directory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/soak"
      - name: Coverage gate
        shell: pwsh
        run: scripts/check-coverage.ps1 -ResultsDirectory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Publish
        run: |
          dotnet publish src/NetLights.App/NetLights.App.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "App publish failed: $LASTEXITCODE" }
          dotnet publish src/NetLights.UpdateAgent/NetLights.UpdateAgent.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=false -p:PublishSingleFile=true -p:DebugType=none -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "Update agent publish failed: $LASTEXITCODE" }
      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
