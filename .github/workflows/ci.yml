name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      resource_run:
        description: 'Run the full one-hour resource measurement'
        type: boolean
        required: false
        default: false
      upgrade_payload_run:
        description: 'Diagnostic automatic chain only, using verified payloads from this CI run ID; empty runs full CI'
        type: string
        required: false
        default: ''
      upgrade_rebuild_bridge:
        description: 'Rebuild and verify a changed compatibility bridge for the diagnostic chain'
        type: boolean
        required: false
        default: false
      upgrade_route:
        description: 'Automatic route for diagnostic reuse of verified payloads'
        type: choice
        options: [Automatic, AutomaticDirect]
        default: Automatic
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - id: select
        shell: pwsh
        run: scripts/select-verification-scope.ps1
  capture-contract:
    needs: scope
    if: needs.scope.outputs.selected == 'capture'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Prepare pinned headless tools
        shell: pwsh
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed.' }
          $channel = [regex]::Match((Get-Content rust-toolchain.toml -Raw), '(?m)^channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$').Groups[1].Value
          if (-not $channel) { throw 'Pinned Rust channel is missing.' }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust bootstrap failed.' }
      - name: Capture contract only, no application build or desktop input
        shell: pwsh
        run: scripts/verify.ps1 -CapturePreflight -ResultsDirectory TestResults/capture-contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capture-contract-results
          path: TestResults/capture-contract
  windows:
    needs: scope
    if: ${{ !inputs.upgrade_payload_run && needs.scope.outputs.selected == 'full' }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CI: true
      CARGO_LLVM_COV_SETUP: "no"
    outputs:
      native_package: ${{ steps.package.outputs.built }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Functional UI test tools
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: false
      - name: Python for offline UI controls
        shell: pwsh
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed.' }
      - name: Verify disposable desktop identity
        shell: pwsh
        run: scripts/prepare-ci-desktop.ps1 -FunctionalUI -ResultsDirectory TestResults/desktop
      - name: Rust toolchain
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $channel = [regex]::Match((Get-Content rust-toolchain.toml -Raw), '(?m)^channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$').Groups[1].Value
          if (-not $channel) { throw 'Rust toolchain must be pinned in rust-toolchain.toml.' }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain setup failed.' }
      - name: Restore build cache
        id: cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          # Restore compilation inputs only; Cargo fingerprints, pinned tool
          # checks and fresh coverage counters still validate this candidate.
          restore-keys: |
            native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            native-win22-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/tools
            artifacts/rust-target
            artifacts/rust-coverage-target
      - name: Verify build, tests and mandatory offline coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: scripts/verify.ps1 -FunctionalUI -ResultsDirectory "TestResults/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Compile installer for isolated upgrade checks
        id: package
        if: ${{ success() }}
        shell: pwsh
        run: |
          . scripts/ci-environment.ps1
          Assert-HostedRunner
          $publish = (Resolve-Path "TestResults/${{ github.run_id }}-${{ github.run_attempt }}/publish").Path
          $setup = Join-Path (Split-Path $publish) 'setup'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Hosted Inno Setup compiler is missing.' }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$publish" "/O$setup" installer/net-lights.iss
          if ($LASTEXITCODE -ne 0) { throw 'Native CI installer build failed.' }
          'built=true' >> $env:GITHUB_OUTPUT
      - name: Upload native upgrade payload
        if: ${{ !cancelled() && steps.package.outputs.built == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-upgrade-payload
          path: |
            TestResults/${{ github.run_id }}-${{ github.run_attempt }}/publish
            TestResults/${{ github.run_id }}-${{ github.run_attempt }}/setup
          if-no-files-found: error
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
      - name: Save build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/tools
            artifacts/rust-target
            artifacts/rust-coverage-target
  bridge:
    needs: scope
    if: ${{ needs.scope.outputs.selected == 'full' && (!inputs.upgrade_payload_run || inputs.upgrade_rebuild_bridge) }}
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      bridge_package: ${{ steps.package.outputs.built }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.204'
      - name: Build and verify bridge from the published baseline
        id: package
        shell: pwsh
        run: |
          scripts/prepare-bridge.ps1 -Verify -Publish -Installer -DownloadBaseline -OutputDirectory artifacts/bridge-1.6.1-ci
          'built=true' >> $env:GITHUB_OUTPUT
      - name: Upload verified bridge payload
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-upgrade-payload
          path: |
            artifacts/bridge-1.6.1-ci/publish
            artifacts/bridge-1.6.1-ci/setup
            artifacts/bridge-1.6.1-ci/NetLights-Setup-win-x64-1.6.0.exe
            artifacts/bridge-1.6.1-ci/bridge.json
            artifacts/bridge-1.6.1-ci/source.json
          if-no-files-found: error
      - name: Upload bridge verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-test-results
          path: |
            artifacts/bridge-1.6.1-ci/*.log
            artifacts/bridge-1.6.1-ci/bridge.json
            artifacts/bridge-1.6.1-ci/tests
  upgrade:
    needs: [windows, bridge]
    if: ${{ !cancelled() && needs.windows.outputs.native_package == 'true' && needs.bridge.outputs.bridge_package == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: Direct
            release: v1.6.0
          - scenario: Bridge
            release: v1.6.0
          - scenario: Automatic
            release: v1.6.0
          - scenario: AutomaticDirect
            release: v1.6.0
          - scenario: Direct
            release: v1.4.2
          - scenario: Direct
            release: v1.7.0
          - scenario: Bridge
            release: v1.4.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: matrix.scenario == 'Automatic' || matrix.scenario == 'AutomaticDirect'
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Prepare automatic HTTPS fixture runtime
        if: matrix.scenario == 'Automatic' || matrix.scenario == 'AutomaticDirect'
        shell: pwsh
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Fixture Python bootstrap failed.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-upgrade-payload
          path: artifacts/native-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bridge-upgrade-payload
          path: artifacts/bridge-1.6.1-ci
      - name: Real installed upgrade and recovery
        shell: pwsh
        run: |
          $baseline = 'artifacts/bridge-1.6.1-ci/NetLights-Setup-win-x64-1.6.0.exe'
          $extra = @{}
          if ('${{ matrix.release }}' -eq 'v1.4.2') {
            $baseline = 'artifacts/NetLights-Setup-win-x64-1.4.2.exe'
            & curl.exe --fail --location --proto '=https' --max-time 120 --max-redirs 5 --max-filesize 59084561 --output $baseline 'https://github.com/AryaPaw/net-lights/releases/download/v1.4.2/NetLights-Setup-win-x64-1.4.2.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned historical installer download failed.' }
            $extra = @{BaselineSha256='31695b0eabb66fa52b69ac71a177c1a95480e2516678fdb8d519914e39639197'; BaselineBytes=59084561}
          }
          if ('${{ matrix.release }}' -eq 'v1.7.0') {
            $baseline = 'artifacts/NetLights-Setup-win-x64-1.7.0.exe'
            & curl.exe --fail --location --proto '=https' --max-time 120 --max-redirs 5 --max-filesize 9685535 --output $baseline 'https://github.com/AryaPaw/net-lights/releases/download/v1.7.0/NetLights-Setup-win-x64-1.7.0.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned native installer download failed.' }
            $extra = @{BaselineSha256='4b36b1f7957cff32234fd6456ead1f29f9f68d635981c2f89af4b46972527931'; BaselineBytes=9685535}
          }
          $nativeInstallers = @(Get-ChildItem artifacts/native-ci/setup -File -Filter 'NetLights-Setup-win-x64-*.exe')
          if ($nativeInstallers.Count -ne 1) { throw 'Expected exactly one verified native installer.' }
          $releasePath = '${{ matrix.release }}'.Replace('.','-')
          scripts/test-ci-upgrade.ps1 -Scenario '${{ matrix.scenario }}' -ReleaseTag '${{ matrix.release }}' @extra -BaselineInstaller $baseline -BridgeInstaller artifacts/bridge-1.6.1-ci/setup/NetLights-Setup-win-x64-1.6.1.exe -BridgePublishDirectory artifacts/bridge-1.6.1-ci/publish -NativeInstaller $nativeInstallers[0].FullName -NativePublishDirectory artifacts/native-ci/publish -ResultsDirectory "artifacts/ci-upgrade-${{ matrix.scenario }}-$releasePath"
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-${{ matrix.scenario }}-${{ matrix.release }}
          path: artifacts/ci-upgrade-*
  automatic-diagnostic:
    needs: bridge
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.upgrade_payload_run && github.ref == 'refs/heads/codex/1.7.0-ci' && (needs.bridge.result == 'success' || needs.bridge.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CI: true
      SOURCE_RUN: ${{ inputs.upgrade_payload_run }}
      REBUILD_BRIDGE: ${{ inputs.upgrade_rebuild_bridge }}
      UPGRADE_ROUTE: ${{ inputs.upgrade_route || 'Automatic' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate diagnostic reuse of unchanged product inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:SOURCE_RUN -cnotmatch '^[1-9][0-9]{0,15}$') { throw 'Expected a completed source CI run ID.' }
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Source run lookup failed.' }
          if ($source.head_branch -cnotin @('main','codex/1.7.0-ci') -or $source.path -cne '.github/workflows/ci.yml' -or $source.status -cne 'completed' -or $source.conclusion -cne 'success' -or $source.event -cnotin @('push','workflow_dispatch') -or $source.head_repository.full_name -cne $env:GITHUB_REPOSITORY) { throw 'Source must be a successful full CI run of main or the authorized diagnostic branch in this repository.' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $jobs.total_count -gt 100) { throw 'Source job inventory is unavailable or exceeds its bound.' }
          foreach ($name in @('windows','bridge')) {
            $matching = @($jobs.jobs | Where-Object name -CEQ $name)
            if ($matching.Count -ne 1 -or $matching[0].conclusion -cne 'success') { throw 'Source build/verification jobs must have succeeded.' }
          }
          $changed = @(git diff --name-only $source.head_sha $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'Source comparison failed.' }
          $allowed = @('scripts/test-ci-upgrade.ps1','scripts/automatic-update-fixture.ps1','scripts/fixtures/automatic-update-feed.py','scripts/verify.ps1','scripts/promote-verified-release.ps1','.github/workflows/ci.yml','.github/workflows/promote-release.yml','.cursor/skills/net-lights-ship/SKILL.md','AGENTS.md','docs/DEVELOPMENT.md')
          if ($env:REBUILD_BRIDGE -ceq 'true') { $allowed += @('compat/bridge-1.6.1.patch','scripts/prepare-bridge.ps1') }
          if (@($changed | Where-Object { $_ -cnotin $allowed }).Count) { throw 'Product or packaging inputs changed; run full CI instead.' }
          New-Item -ItemType Directory -Path artifacts/ci-upgrade-source | Out-Null
          @{nativeSourceRun=$env:SOURCE_RUN;nativeSourceCommit=$source.head_sha;bridgeSourceRun=$(if ($env:REBUILD_BRIDGE -ceq 'true') {$env:GITHUB_RUN_ID} else {$env:SOURCE_RUN});diagnosticCommit=$env:GITHUB_SHA;unchangedNativeInputs=$true;fullCI='NOT RUN'} | ConvertTo-Json | Set-Content artifacts/ci-upgrade-source/identity.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-upgrade-payload
          path: artifacts/native-ci
          run-id: ${{ inputs.upgrade_payload_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bridge-upgrade-payload
          path: artifacts/bridge-1.6.1-ci
          run-id: ${{ inputs.upgrade_rebuild_bridge && github.run_id || inputs.upgrade_payload_run }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Run the selected real automatic upgrade route
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Fixture Python bootstrap failed.' }
          $nativeInstallers = @(Get-ChildItem artifacts/native-ci/setup -File -Filter 'NetLights-Setup-win-x64-*.exe')
          if ($nativeInstallers.Count -ne 1) { throw 'Expected exactly one verified native installer.' }
          if ($env:UPGRADE_ROUTE -cnotin @('Automatic','AutomaticDirect')) { throw 'Invalid automatic upgrade diagnostic route.' }
          scripts/test-ci-upgrade.ps1 -Scenario $env:UPGRADE_ROUTE -BaselineInstaller artifacts/bridge-1.6.1-ci/NetLights-Setup-win-x64-1.6.0.exe -BridgeInstaller artifacts/bridge-1.6.1-ci/setup/NetLights-Setup-win-x64-1.6.1.exe -BridgePublishDirectory artifacts/bridge-1.6.1-ci/publish -NativeInstaller $nativeInstallers[0].FullName -NativePublishDirectory artifacts/native-ci/publish -ResultsDirectory ('artifacts/ci-upgrade-' + $env:UPGRADE_ROUTE)
      - name: Upload automatic chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automatic-upgrade-diagnostic
          path: artifacts/ci-upgrade-*
          if-no-files-found: error
  motion:
    needs: windows
    if: ${{ !cancelled() && needs.windows.outputs.native_package == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-upgrade-payload
          path: artifacts/motion-candidate
      - name: Prepare isolated motion measurement
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed.' }
          scripts/prepare-ci-desktop.ps1 -FunctionalUI -ResultsDirectory TestResults/desktop
      - name: Require motion evidence from this run's exact normal executable
        run: |
          $exe = (Resolve-Path artifacts/motion-candidate/publish/NetLights.exe).Path
          scripts/test-native-ui.ps1 -FunctionalUI -NavigationMeasurement -VerificationScope Navigation -Executable $exe -ExpectedSha256 (Get-FileHash -LiteralPath $exe).Hash -ResultsDirectory TestResults/motion
      - name: Upload motion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-results
          path: |
            TestResults
            !TestResults/**/profile/**
          if-no-files-found: error
  resources:
    if: github.ref == 'refs/heads/codex/1.7.0-ci' && github.event_name == 'workflow_dispatch' && inputs.resource_run
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CI: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Prepare disposable hosted desktop
        run: |
          uv python install 3.11
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed.' }
          scripts/prepare-ci-desktop.ps1 -FunctionalUI -ResultsDirectory TestResults/resource-desktop
      - name: Restore normal build inputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            native-win22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            native-win22-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/tools
            artifacts/rust-target
            artifacts/rust-coverage-target
      - name: Install pinned Rust toolchain
        run: |
          $channel = [regex]::Match((Get-Content rust-toolchain.toml -Raw), '(?m)^channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$').Groups[1].Value
          if (-not $channel) { throw 'Pinned Rust toolchain missing.' }
          rustup toolchain install $channel --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust bootstrap failed.' }
      - name: Build exact normal candidate
        run: scripts/publish.ps1 -OutputDirectory artifacts/resource-publish
      - name: Run complete hosted UI and one-hour resource measurement
        run: |
          $exe = (Resolve-Path artifacts/resource-publish/NetLights.exe).Path
          $sha = (Get-FileHash -LiteralPath $exe).Hash
          scripts/test-native-ui.ps1 -HostedResource -Executable $exe -ExpectedSha256 $sha -MeasureSeconds 3600 -MaximumHistory -EnableCountryForMeasurement -ResultsDirectory TestResults/resources
      - name: Require stable memory and Windows resource trends
        run: scripts/test-resource-stability.ps1 -InputPath TestResults/resources/ui/resource-measurement.csv
      - name: Upload resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-results
          path: |
            TestResults
            !TestResults/**/profile/**
            !TestResults/**/measurement-private/**
          if-no-files-found: error
